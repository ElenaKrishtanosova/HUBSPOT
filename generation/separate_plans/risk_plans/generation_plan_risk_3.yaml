insight_name: "Churn Risk Signal"
description: "A data generation plan to validate the insight about a long-term customer facing repeated issues. This plan focuses on creating a single contact with multiple support tickets, notes, emails, and calls that show frustration and repeated follow-ups."

data_to_generate:
  - entity: "contacts"
    count: 1
    properties:
      - name: "first_name"
        type: "faker.first_name"
      - name: "last_name"
        type: "faker.last_name"
      - name: "contact_email"
        type: "faker.email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"

  - entity: "tickets"
    count: 3
    properties:
      - name: "ticket_name"
        type: "static"
        value: "Repeated issue with crumb tray on Retro Toaster"
      - name: "priority"
        type: "static"
        value: "High"
      - name: "issue_of_interest"
        type: "static"
        value: "Crumb tray"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Third time I'm contacting you about the crumb tray on my Retro Toaster. It's getting stuck and I can't clean it properly."
          - "I've already submitted two tickets for this issue, but it's still not resolved. I am very frustrated with the support process."
          - "The crumb tray issue on my Retro Toaster is a major design flaw. I'm disappointed with the lack of progress on my previous tickets."
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "ticket_owner"
        type: "random_existing_id"
        table: "users"
        column: "email"
      - name: "activity_date"
        type: "faker.past_date"

  - entity: "notes"
    count: 6
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Agent note: Customer on Ticket #<TICKET_ID> is extremely frustrated about the crumb tray issue. Said they've called twice before. Escalating to a senior technician for a permanent fix."
          - "Customer note: My latest follow-up call confirmed the issue is still there. This is unacceptable for a long-term customer."
          - "Agent note: Provided new troubleshooting steps for the crumb tray issue. Customer seemed skeptical but agreed to try. Will follow up in 3 days."
          - "Customer note: Followed troubleshooting steps for the crumb tray on the Retro Toaster. It's still not working. I need a real solution, not another temporary fix."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "ticket_id"
        type: "random_existing_id"
        table: "tickets"
        column: "ticket_id"
        
  - entity: "emails"
    count: 2
    properties:
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "subject"
        type: "static"
        value: "Re: My toaster is still broken"
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer email: I am following up on my support ticket again. The crumb tray issue on my Retro Toaster is still not fixed. This is unacceptable."
          - "Customer email: This is my third email about the crumb tray. I'm disappointed with the lack of progress and will consider returning the product if this isn't resolved soon."
      - name: "direction"
        type: "static"
        value: "Incoming"
      - name: "created_at"
        type: "faker.past_date"

  - entity: "calls"
    count: 2
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call summary: Customer called to complain about the ongoing crumb tray issue. They mentioned they've sent multiple emails and opened several tickets."
          - "Support call: Customer expressed disappointment with the lack of resolution. They were very frustrated and mentioned they are a long-term user and expected better service."
      - name: "direction"
        type: "static"
        value: "Inbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "activity_at"
        type: "faker.past_date"
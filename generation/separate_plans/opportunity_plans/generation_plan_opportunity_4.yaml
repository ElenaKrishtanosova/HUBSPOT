insight_name: "Product Design Wins"
description: "A data generation plan to validate the insight that customers who have purchased the 'smart toaster' model repeatedly praise its 'minimalist aesthetic and beautiful design,' which could be a key marketing angle to amplify."

data_to_generate:
  - entity: "notes"
    count: 8
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer feedback note: The smart toaster's minimalist aesthetic is absolutely stunning. It's become a conversation piece in my kitchen."
          - "Product review note: What I love most about the smart toaster is its beautiful design. It looks like a piece of modern art in my kitchen."
          - "Support call note: Customer called just to compliment the smart toaster's design. Said it's the most beautiful appliance they own."
          - "Sales feedback note: Multiple customers mention the smart toaster's design as their primary reason for purchase. This aesthetic appeal is a major selling point."
          - "Customer testimonial note: The smart toaster's minimalist design is perfect for my modern kitchen. I'd buy it again just for the aesthetics."
          - "Design appreciation note: Customer specifically mentioned they chose the smart toaster over competitors because of its superior design and aesthetic appeal."
          - "Kitchen design note: The smart toaster's beautiful design has inspired several customers to redesign their kitchen around it."
          - "Aesthetic feedback note: Consistent praise for the smart toaster's minimalist aesthetic. This design element is clearly resonating with customers."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"

  - entity: "emails"
    count: 5
    properties:
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "subject"
        type: "static"
        value: "Smart Toaster Design Appreciation"
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer email: I just wanted to say how much I love the design of my smart toaster. It's the most beautiful appliance in my kitchen."
          - "Design feedback email: The smart toaster's minimalist aesthetic is exactly what I was looking for. It's become a centerpiece in my kitchen design."
          - "Aesthetic appreciation email: I chose the smart toaster primarily for its beautiful design. The functionality is great, but the aesthetics are what sold me."
          - "Kitchen design email: Your smart toaster's design inspired me to redesign my entire kitchen. It's that beautiful and well-designed."
          - "Design compliment email: The smart toaster's minimalist aesthetic is perfect. I've received so many compliments from guests about how beautiful it looks."
      - name: "direction"
        type: "static"
        value: "Incoming"
      - name: "created_at"
        type: "faker.past_date"

  - entity: "calls"
    count: 4
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call summary: Customer called specifically to praise the smart toaster's design. Said it's the most beautiful appliance they've ever owned."
          - "Design feedback call: Customer mentioned they chose the smart toaster over competitors because of its superior aesthetic appeal and minimalist design."
          - "Aesthetic appreciation call: During support call, customer couldn't stop talking about how beautiful the smart toaster looks in their kitchen."
          - "Design compliment call: Customer called to say the smart toaster's design has inspired several friends to purchase the same model."
      - name: "direction"
        type: "static"
        value: "Inbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "activity_at"
        type: "faker.past_date"

  - entity: "deals"
    count: 3
    properties:
      - name: "deal_name"
        type: "static"
        value: "Smart Toaster - Design-Driven Purchase"
      - name: "deal_stage"
        type: "static"
        value: "Closed Won"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer chose smart toaster primarily for its beautiful minimalist design. Said aesthetics were more important than features."
          - "Prospect mentioned they were drawn to the smart toaster's design first, then discovered its functionality. Design was the deciding factor."
          - "Client purchased smart toaster because it perfectly matched their kitchen's aesthetic. The beautiful design was the primary selling point."
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "activity_date"
        type: "faker.past_date"

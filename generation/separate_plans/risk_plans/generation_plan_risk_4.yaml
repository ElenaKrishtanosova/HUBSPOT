insight_name: "Compliance Concerns"
description: "A data generation plan to validate the insight about compliance concerns on smart toaster packaging. This plan focuses on creating a pattern of support tickets, notes, emails, and calls that mention the lack of safety certifications."

data_to_generate:
  - entity: "contacts"
    count: 2
    properties:
      - name: "first_name"
        type: "faker.first_name"
      - name: "last_name"
        type: "faker.last_name"
      - name: "contact_email"
        type: "faker.email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
  
  - entity: "tickets"
    count: 4
    properties:
      - name: "ticket_name"
        type: "static"
        value: "Question about smart toaster packaging certifications"
      - name: "priority"
        type: "static"
        value: "Medium"
      - name: "issue_of_interest"
        type: "static"
        value: "Packaging"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "I am a new user of your smart toaster and I noticed that the packaging does not display any safety certifications like UL or CE. Is this product certified?"
          - "A customer noticed that the packaging for the smart toaster seems to be missing standard safety certification marks. They are concerned about the product's compliance."
          - "I bought a smart toaster from you and was surprised to see no safety certifications on the box. Can you confirm the product's compliance?"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "ticket_owner"
        type: "random_existing_id"
        table: "users"
        column: "email"
      - name: "activity_date"
        type: "faker.past_date"

  - entity: "notes"
    count: 6
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "A customer service note documenting a call. The customer was concerned about the lack of safety certification symbols on the smart toaster box. They asked for confirmation that the product is compliant with local regulations."
          - "Follow-up note for a ticket regarding packaging. Customer is still concerned about the lack of compliance markings and is requesting official documentation."
          - "Internal note: A client raised a question about safety certifications on the smart toaster packaging. This is the second time this week we've received this inquiry."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"
      - name: "ticket_id"
        type: "random_existing_id"
        table: "tickets"
        column: "ticket_id"

  - entity: "emails"
    count: 2
    properties:
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "subject"
        type: "static"
        value: "Question about Toaster Safety Certifications"
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer email: Can you please confirm the safety certifications for the smart toaster? The packaging does not seem to have any markings, and I'm concerned about compliance."
          - "Customer email: I noticed the box for the smart toaster doesn't have a UL or CE mark. Can you send me documentation to confirm the product is safe and certified?"
      - name: "direction"
        type: "static"
        value: "Incoming"
      - name: "created_at"
        type: "faker.past_date"

  - entity: "calls"
    count: 2
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call summary: Customer called to express concern about the lack of safety certification labels on the smart toaster packaging. They want to ensure the product meets safety standards."
          - "Support call: Customer called after sending an email about safety concerns. They were worried about compliance and asked for specific certification numbers."
      - name: "direction"
        type: "static"
        value: "Inbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "activity_at"
        type: "faker.past_date"
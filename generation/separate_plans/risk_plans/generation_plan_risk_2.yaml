insight_name: "Competitor Pricing Threat"
description: "A data generation plan to validate the insight about a competitor's lower pricing. This plan creates a comprehensive scenario of lost deals, sales notes, calls, and emails that consistently mention the competitor 'SliceMaster' and a 15% price difference."

data_to_generate:
  - entity: "deals"
    count: 5
    properties:
      - name: "deal_name"
        type: "static"
        value: "Lost to competitor - price issue"
      - name: "deal_stage"
        type: "static"
        value: "Closed Lost"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Lost the deal because prospect found a competitor, SliceMaster, offering a similar 4-slice toaster for 15% less. They said they couldn't justify the price difference."
          - "Notes from a sales call: The prospect was interested in our 4-slice toaster, but ultimately decided to go with SliceMaster due to their aggressive pricing strategy."
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "activity_date"
        type: "faker.past_date"

  - entity: "notes"
    count: 8
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Sales manager note: Multiple deals for our 4-slice toaster are being lost to SliceMaster. They are consistently undercutting our price by about 15%."
          - "Customer feedback call: The client liked our 4-slice toaster but explicitly mentioned that SliceMaster's model was more affordable and they went with them instead."
          - "Market research note: Our 4-slice toaster is struggling to compete on price in the mid-range segment. Competitor SliceMaster has a clear advantage here."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"

  - entity: "calls"
    count: 3
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call transcript summary: Spoke with the prospect. They said our 4-slice toaster was a good product, but they were leaning towards SliceMaster because of the lower price."
          - "Call notes: Prospect mentioned SliceMaster's price was a deciding factor. They explicitly stated a 15% discount on a comparable model."
      - name: "direction"
        type: "static"
        value: "Outbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "activity_at"
        type: "faker.past_date"

  - entity: "emails"
    count: 3
    properties:
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "subject"
        type: "static"
        value: "Re: Quote for the 4-slice toaster"
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Email from prospect: Thank you for the quote, but we've decided to go with a competitor. Their price on a 4-slice model was significantly better."
          - "Internal email: A follow-up from a lost deal. The prospect confirmed the decision was purely based on the price difference from SliceMaster."
      - name: "direction"
        type: "static"
        value: "Incoming"
      - name: "created_at"
        type: "faker.past_date"
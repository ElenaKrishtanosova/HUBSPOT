insight_name: "Smart Toaster App Issues"
description: "A data generation plan to validate the insight about smart toaster app being buggy and freezing frequently, focusing on tickets, notes, emails, and support interactions."

data_to_generate:
  - entity: "tickets"
    count: 15
    properties:
      - name: "ticket_name"
        type: "static"
        value: "Smart Toaster App Freezing Issue"
      - name: "priority"
        type: "static"
        value: "High"
      - name: "issue_of_interest"
        type: "static"
        value: "Wi‑Fi setup"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer reports that the smart toaster app freezes when trying to set custom toast settings"
          - "App crashes every time user tries to connect to WiFi network"
          - "Smart toaster app becomes unresponsive after 5 minutes of use"
          - "Customer cannot complete firmware update due to app freezing"
          - "Smart toaster app shows error message and then freezes completely"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "ticket_owner"
        type: "random_existing_id"
        table: "users"
        column: "email"
      - name: "activity_date"
        type: "faker.past_date"

  - entity: "notes"
    count: 8
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Support note: Customer called about smart toaster app freezing. App becomes unresponsive when trying to set custom toast settings. This is the 3rd call this week about app issues."
          - "Technical note: Smart toaster app crashes during WiFi setup. Error logs show memory leak in the app. Need to escalate to development team."
          - "Customer feedback: Smart toaster app is buggy and freezes frequently. User had to restart the app 5 times to complete a simple task."
          - "Support escalation: Multiple customers reporting smart toaster app freezing issues. Pattern suggests systematic problem with mobile application."
          - "Quality assurance note: Smart toaster app tested on multiple devices, consistently freezes after 10-15 minutes of use. Critical bug identified."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"

  - entity: "emails"
    count: 5
    properties:
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "subject"
        type: "static"
        value: "Smart Toaster App Issues - Urgent Support Needed"
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer email: The smart toaster app keeps freezing when I try to use it. I've tried restarting my phone and reinstalling the app, but the problem persists. This is very frustrating as I can't use the smart features I paid for."
          - "Support response: We apologize for the smart toaster app issues you're experiencing. Our technical team is aware of the freezing problems and working on a fix. In the meantime, you can use the manual controls on the toaster."
          - "Customer complaint: The smart toaster app is completely unusable due to constant freezing. I've spent hours trying to get it to work properly. This is not what I expected when I bought a premium smart appliance."
      - name: "direction"
        type: "static"
        value: "Incoming"

  - entity: "calls"
    count: 3
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call summary: Customer called about smart toaster app freezing. App becomes unresponsive after 2-3 minutes of use. Customer is very frustrated and wants immediate solution."
          - "Support call: Smart toaster app crashes during WiFi setup process. Customer tried multiple times but app freezes every time. Escalated to technical support."
          - "Customer service call: Multiple complaints about smart toaster app being buggy and freezing frequently. Pattern of issues suggests systematic problem with mobile application."
      - name: "direction"
        type: "static"
        value: "Inbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "activity_at"
        type: "faker.past_date"
insight_name: "Backlogged Support Queue"
description: "A data generation plan to validate the insight about an increased average resolution time for support tickets. The plan focuses on creating a high volume of tickets with delayed closure dates, a pattern of notes indicating delays, and a longer time between ticket submission and resolution."

data_to_generate:
  - entity: "tickets"
    count: 20
    properties:
      - name: "ticket_name"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer asking for an update on a shipping delay."
          - "Customer reporting a small issue with their 4-slice toaster."
          - "New user needs help with a basic question about the smart toaster."
          - "Customer requesting a refund."
      - name: "priority"
        type: "static"
        value: "Medium"
      - name: "issue_of_interest"
        type: "static"
        value: "Shipping delay"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer is following up after 5 days with no response to their initial ticket. Asks why it's taking so long to get help."
          - "Follow-up email from a client who submitted a ticket a week ago. They express frustration with the long waiting time."
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "ticket_owner"
        type: "random_existing_id"
        table: "users"
        column: "email"
      - name: "activity_date"
        type: "faker.past_date"

  - entity: "notes"
    count: 10
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Internal note: Ticket #<TICKET_ID> has been open for over a week with no action. The customer sent a follow-up email."
          - "Manager note: Noticed a growing backlog in the support queue. We need to address the increased volume and resolution time."
          - "Support note: I am unable to get to this ticket due to a high queue volume. I will pick it up as soon as possible."
          - "Analysis note: The average resolution time for tickets has increased by 15% in the last quarter, indicating a growing backlog."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "ticket_id"
        type: "random_existing_id"
        table: "tickets"
        column: "ticket_id"

  - entity: "tasks"
    count: 5
    properties:
      - name: "title"
        type: "static"
        value: "Follow up on customer support ticket"
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Internal note: Task created to follow up on a ticket that's been open for 5 days with no action. Need to prioritize this."
          - "Task note: This ticket has been in the queue for a week. Customer is waiting for a response. Urgently needs to be assigned."
          - "Task note: Follow up on Ticket #<TICKET_ID>. The customer called to express frustration with the long wait time."
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"
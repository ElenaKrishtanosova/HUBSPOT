insight_name: "Market Uncertainty"
description: "A data generation plan to validate the insight about B2B customers delaying purchases due to market uncertainty and budget cuts. This plan focuses on creating deals, notes, calls, and emails that contain keywords related to economic and market risks."

data_to_generate:
  - entity: "contacts"
    count: 3
    properties:
      - name: "first_name"
        type: "faker.first_name"
      - name: "last_name"
        type: "faker.last_name"
      - name: "contact_email"
        type: "faker.email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"

  - entity: "deals"
    count: 3
    properties:
      - name: "deal_name"
        type: "static"
        value: "Delayed Purchase - Corporate Order"
      - name: "deal_stage"
        type: "static"
        value: "Presentation Scheduled"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Notes from a meeting with the client: They like the product but are putting the purchase on hold due to new company-wide budget cuts."
          - "A sales note regarding a B2B deal: The prospect is delaying the final decision, citing market uncertainty and a need to wait for the next quarter's budget review."
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "activity_date"
        type: "faker.past_date"

  - entity: "notes"
    count: 5
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call summary: The B2B client expressed interest but said the deal is on hold. They mentioned their company has frozen spending due to 'economic headwinds.'"
          - "Internal note: Check in on the status of the 'Corporate Order' deal. The contact mentioned 'budget constraints' and an 'uncertain market' as reasons for the delay."
          - "Follow-up note: The client confirmed the deal is paused. They are worried about the 'broader retail market' and their company's profitability this quarter."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"

  - entity: "calls"
    count: 2
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call notes: Prospect called to say their purchase is being delayed. They cited 'market instability' and a 'tight budget' from their finance department."
          - "Call summary: Followed up with the B2B contact. They confirmed the deal is on hold for at least another quarter due to 'company-wide cost-cutting measures.'"
      - name: "direction"
        type: "static"
        value: "Outbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"
      - name: "activity_at"
        type: "faker.past_date"

  - entity: "emails"
    count: 2
    properties:
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "subject"
        type: "static"
        value: "Re: Update on the Corporate Toaster Order"
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Email from prospect: We're very interested in your toasters, but given the current economic uncertainty, we've had to freeze all non-essential capital expenditures for this quarter."
          - "Internal email: The B2B deal is paused. The client confirmed via email that a company-wide budget review is delaying all purchases for the foreseeable future."
      - name: "direction"
        type: "static"
        value: "Incoming"
      - name: "created_at"
        type: "faker.past_date"
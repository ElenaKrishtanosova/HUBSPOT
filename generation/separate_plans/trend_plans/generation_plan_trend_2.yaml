insight_name: "Emerging Use Cases"
description: "A data generation plan to validate the insight that a new use case for toasters is emerging in customer conversations: a tool for quickly reheating pre-made breakfast sandwiches for busy professionals."

data_to_generate:
  - entity: "notes"
    count: 7
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer feedback note: Customer mentioned using our toaster to reheat breakfast sandwiches. Said it's perfect for their busy morning routine."
          - "New use case note: Prospect asked if our toaster can handle reheating pre-made sandwiches. This is becoming a common inquiry from busy professionals."
          - "Market trend note: Multiple customers mentioning breakfast sandwich reheating as primary use case. This represents a shift in how toasters are being used."
          - "Product application note: Customer discovered new use for our toaster - reheating breakfast sandwiches. Said it's faster than microwave and tastes better."
          - "Use case evolution note: The traditional 'toast bread' use case is expanding. Customers now want toasters that can handle breakfast sandwiches and other foods."
          - "Busy professional note: Customer mentioned they chose our toaster specifically for reheating breakfast sandwiches. This use case is growing among time-pressed professionals."
          - "Innovation feedback note: Customer suggested we market our toaster as a breakfast sandwich reheater. This new use case could open new market segments."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"

  - entity: "calls"
    count: 5
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call transcript: Customer called to ask about using our toaster for breakfast sandwiches. Said they're a busy professional and need quick breakfast solutions."
          - "Use case inquiry call: Prospect asked if our toaster can reheat pre-made sandwiches. This breakfast sandwich use case is becoming more common."
          - "Product application call: Customer discovered new use for our toaster - reheating breakfast sandwiches. Said it's perfect for their morning routine."
          - "Innovation call: Customer suggested we develop toaster specifically for breakfast sandwiches. This new use case could be a market opportunity."
          - "Busy professional call: Customer mentioned they need toaster that can handle breakfast sandwiches quickly. This use case is growing among time-pressed customers."
      - name: "direction"
        type: "static"
        value: "Inbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "activity_at"
        type: "faker.past_date"

  - entity: "emails"
    count: 4
    properties:
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "subject"
        type: "static"
        value: "Breakfast Sandwich Reheating Question"
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer email: I'm a busy professional and need to know if your toaster can reheat breakfast sandwiches. This would be perfect for my morning routine."
          - "Use case inquiry email: Looking for a toaster that can handle breakfast sandwiches. Your product looks promising for this new use case."
          - "Product application email: I discovered that your toaster works great for reheating breakfast sandwiches. This could be a new market for you."
          - "Innovation suggestion email: Consider marketing your toaster for breakfast sandwiches. This use case is growing among busy professionals like me."
      - name: "direction"
        type: "static"
        value: "Incoming"
      - name: "created_at"
        type: "faker.past_date"

  - entity: "deals"
    count: 3
    properties:
      - name: "deal_name"
        type: "static"
        value: "Breakfast Sandwich Reheating Solution"
      - name: "deal_stage"
        type: "static"
        value: "Qualified to Buy"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Prospect needs toaster solution for reheating breakfast sandwiches. This emerging use case represents new market opportunity."
          - "Customer discovered new application for our toaster - breakfast sandwich reheating. This use case evolution could expand our market."
          - "Prospect interested in toaster specifically for breakfast sandwiches. This new use case is growing among busy professionals."
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "activity_date"
        type: "faker.past_date"

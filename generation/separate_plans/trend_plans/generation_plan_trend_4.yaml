insight_name: "Decreased Shipping Complaints"
description: "A data generation plan to validate the insight that complaints about slow shipping times, a previous issue, have decreased by 50% in the last six months, signaling a successful improvement effort."

data_to_generate:
  - entity: "notes"
    count: 8
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer feedback note: Customer mentioned how fast the shipping was. Said they were impressed with the delivery speed compared to other companies."
          - "Shipping improvement note: Customer commented on improved shipping times. This represents a significant improvement from previous complaints about slow delivery."
          - "Delivery satisfaction note: Multiple customers praising our shipping speed. The decrease in shipping complaints shows our logistics improvements are working."
          - "Shipping trend note: Customer feedback shows shipping complaints have decreased by 50% this quarter. Our logistics improvements are clearly successful."
          - "Delivery appreciation note: Customer specifically mentioned they love our fast shipping. Said it was much better than their previous experience with us."
          - "Logistics success note: Customer feedback consistently mentions improved shipping times. This represents a successful turnaround in our delivery performance."
          - "Shipping turnaround note: The shift from shipping complaints to shipping praise shows our logistics team's improvements are working."
          - "Delivery improvement note: Customer mentioned they were pleasantly surprised by our shipping speed. This improvement trend is becoming consistent."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"

  - entity: "emails"
    count: 5
    properties:
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "subject"
        type: "static"
        value: "Fast Shipping Appreciation"
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer email: I just wanted to say how impressed I am with your fast shipping. It arrived much sooner than expected!"
          - "Shipping feedback email: Thank you for the quick delivery. Your shipping speed has improved significantly from my last order."
          - "Delivery appreciation email: I love how fast your shipping is now. This is a huge improvement from the slow delivery I experienced before."
          - "Logistics praise email: Your shipping team is doing an amazing job. The delivery was lightning fast compared to other companies."
          - "Shipping improvement email: I noticed your shipping has gotten much faster. This improvement makes a big difference in customer satisfaction."
      - name: "direction"
        type: "static"
        value: "Incoming"
      - name: "created_at"
        type: "faker.past_date"

  - entity: "calls"
    count: 4
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call summary: Customer called specifically to praise our fast shipping. Said it was a huge improvement from previous slow delivery experiences."
          - "Shipping feedback call: Customer mentioned they were impressed with our shipping speed. This represents a successful turnaround in delivery performance."
          - "Delivery appreciation call: Customer called to compliment our improved shipping times. Said they'll definitely order again because of the fast delivery."
          - "Logistics success call: During support call, customer mentioned how much our shipping has improved. This improvement trend is becoming consistent."
      - name: "direction"
        type: "static"
        value: "Inbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "activity_at"
        type: "faker.past_date"

  - entity: "tickets"
    count: 2
    properties:
      - name: "ticket_name"
        type: "static"
        value: "Shipping Speed Inquiry"
      - name: "priority"
        type: "static"
        value: "Low"
      - name: "issue_of_interest"
        type: "static"
        value: "Shipping delay"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer ticket: Asking about shipping times. Wanted to know if our fast shipping is consistent across all orders."
          - "Shipping question ticket: Customer curious about our improved shipping speed. Said they heard good things about our delivery performance."
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "ticket_owner"
        type: "random_existing_id"
        table: "users"
        column: "email"
      - name: "activity_date"
        type: "faker.past_date"

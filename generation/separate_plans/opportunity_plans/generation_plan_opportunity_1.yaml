insight_name: "Repeated Feature Request"
description: "A data generation plan to validate the insight that multiple support notes and product reviews request a built-in 'bun warmer' as a new feature for the 4-slice toaster model."

data_to_generate:
  - entity: "notes"
    count: 8
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer feedback note: The 4-slice toaster works great, but I really wish it had a built-in bun warmer. I'm constantly having to use a separate appliance for this."
          - "Product review note: Love the 4-slice toaster, but would pay extra for a model with a bun warmer. This is the most requested feature from our customers."
          - "Support call note: Customer asked if we have plans to add a bun warmer to the 4-slice model. Said they'd upgrade immediately if we did."
          - "Sales feedback note: Multiple prospects have asked about a 4-slice toaster with bun warmer. This seems to be a consistent request across different customer segments."
          - "Customer suggestion note: The 4-slice toaster is perfect for my family, but a built-in bun warmer would make it the ultimate breakfast appliance."
          - "Market research note: Survey results show 67% of 4-slice toaster owners want a bun warmer feature. This is our top requested enhancement."
          - "Product development note: Customer feedback consistently mentions bun warmer as the most desired feature for the 4-slice model."
          - "Support escalation note: This is the 5th call this week asking about bun warmer functionality. Clearly a high-demand feature."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"

  - entity: "calls"
    count: 4
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call transcript: Customer called to ask about upgrading to a 4-slice toaster with bun warmer. When told it doesn't exist, they expressed disappointment and said they'd wait for that feature."
          - "Support call notes: Customer requested information about bun warmer availability for 4-slice model. Said this feature would solve their morning routine completely."
          - "Sales call summary: Prospect interested in 4-slice toaster but specifically asked about bun warmer functionality. This feature request came up multiple times during the conversation."
          - "Customer service call: Customer called to suggest adding bun warmer to 4-slice toaster. Said they'd recommend it to friends if this feature was available."
      - name: "direction"
        type: "static"
        value: "Inbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "activity_at"
        type: "faker.past_date"

  - entity: "emails"
    count: 3
    properties:
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "subject"
        type: "static"
        value: "Feature Request: Bun Warmer for 4-Slice Toaster"
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer email: I love my 4-slice toaster, but I really need a bun warmer feature. Do you have plans to add this? I'd upgrade immediately."
          - "Feedback email: The 4-slice toaster is great, but a built-in bun warmer would make it perfect. This is the most requested feature from my friends who also own your toasters."
          - "Product suggestion email: I'm considering buying a 4-slice toaster but would prefer one with a bun warmer. When will this feature be available?"
      - name: "direction"
        type: "static"
        value: "Incoming"
      - name: "created_at"
        type: "faker.past_date"

insight_name: "Language Shift"
description: "A data generation plan to validate the insight that the language used by new customers is shifting from 'convenience' to 'health and wellness,' with a greater focus on food quality and preparation."

data_to_generate:
  - entity: "notes"
    count: 8
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer feedback note: Customer mentioned they chose our toaster for its ability to preserve nutritional value of bread. Said health is more important than convenience."
          - "Language shift note: New customer used 'health-conscious' and 'nutritional quality' instead of 'convenient' and 'fast.' This represents a clear shift in customer priorities."
          - "Wellness focus note: Customer discussed how our toaster helps them maintain healthy eating habits. Said they're more focused on food quality than speed."
          - "Health priority note: Prospect mentioned they need a toaster that preserves bread's nutritional properties. This health focus is becoming more common than convenience requests."
          - "Wellness language note: Customer used terms like 'healthy eating,' 'nutritional value,' and 'food quality' instead of 'quick' and 'easy.' This language shift is consistent."
          - "Health trend note: Multiple new customers mentioning health and wellness benefits. The shift from convenience to health focus is accelerating."
          - "Nutritional focus note: Customer chose our toaster because it maintains bread's nutritional integrity. Said health benefits outweigh convenience factors."
          - "Wellness shift note: The language in customer feedback is consistently shifting from convenience-focused to health and wellness-focused. This represents a market evolution."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"

  - entity: "calls"
    count: 5
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call transcript: Customer discussed health benefits of our toaster. Said they're more concerned with nutritional value than convenience."
          - "Language shift call: Prospect used 'health-conscious' and 'wellness' language instead of 'convenient.' This represents a clear change in customer priorities."
          - "Wellness focus call: Customer called to ask about health benefits of our toaster. Said they prioritize food quality over speed."
          - "Health priority call: Prospect mentioned they need a toaster that supports healthy eating habits. This health focus is becoming more common."
          - "Nutritional call: Customer discussed how our toaster helps maintain bread's nutritional properties. Said health benefits are their primary concern."
      - name: "direction"
        type: "static"
        value: "Inbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "activity_at"
        type: "faker.past_date"

  - entity: "emails"
    count: 4
    properties:
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "subject"
        type: "static"
        value: "Health and Wellness Benefits Inquiry"
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer email: I'm looking for a toaster that preserves the nutritional value of my bread. Health benefits are more important to me than convenience."
          - "Wellness inquiry email: I need a toaster that supports my healthy eating goals. Can you tell me about the health benefits of your product?"
          - "Health focus email: I'm more concerned with food quality and nutritional preservation than speed. Does your toaster maintain bread's nutritional integrity?"
          - "Wellness priority email: I'm choosing appliances based on health benefits rather than convenience. How does your toaster support healthy eating habits?"
      - name: "direction"
        type: "static"
        value: "Incoming"
      - name: "created_at"
        type: "faker.past_date"

  - entity: "deals"
    count: 3
    properties:
      - name: "deal_name"
        type: "static"
        value: "Health-Conscious Toaster Purchase"
      - name: "deal_stage"
        type: "static"
        value: "Qualified to Buy"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Prospect interested in toaster for health benefits. Said they prioritize nutritional value over convenience features."
          - "Customer chose our toaster because it supports healthy eating habits. This health focus represents a shift from convenience priorities."
          - "Prospect mentioned health and wellness benefits as key factors. Said they're more focused on food quality than speed."
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "activity_date"
        type: "faker.past_date"

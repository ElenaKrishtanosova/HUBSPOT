insight_name: "New Regional Traction"
description: "A data generation plan to validate the insight that an unusual spike in deal inquiries has been observed from boutique cafes in the Downtown LA area, a vertical we had not previously targeted."

data_to_generate:
  - entity: "deals"
    count: 5
    properties:
      - name: "deal_name"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Downtown LA Boutique Cafe - Toaster Inquiry"
          - "LA Arts District Coffee Shop - Equipment Needs"
          - "Downtown LA Specialty Cafe - Toaster Solution"
      - name: "deal_stage"
        type: "static"
        value: "Appointment Scheduled"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Boutique cafe in Downtown LA area inquiring about toaster solutions. This represents new regional market opportunity we haven't previously targeted."
          - "Prospect from Downtown LA coffee shop needs toaster equipment. This area shows unexpected demand from boutique cafe segment."
          - "Downtown LA cafe prospect interested in our toaster products. This regional market segment is showing strong interest."
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "activity_date"
        type: "faker.past_date"

  - entity: "notes"
    count: 7
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Regional market note: Unusual spike in inquiries from Downtown LA boutique cafes. This area shows strong potential we haven't previously targeted."
          - "Market expansion note: Downtown LA cafe segment is showing unexpected interest in our toaster products. This could be a new regional opportunity."
          - "Geographic opportunity note: Multiple inquiries from Downtown LA area suggest this region has strong potential for our cafe and restaurant segment."
          - "Regional trend note: Boutique cafes in Downtown LA are consistently inquiring about our toaster solutions. This represents untapped market potential."
          - "Market research note: Downtown LA area shows strong demand from boutique cafe segment. This regional market could be worth targeting more aggressively."
          - "Geographic expansion note: The spike in Downtown LA inquiries suggests we should consider this area as a priority market for our cafe segment."
          - "Regional opportunity note: Downtown LA boutique cafe market is showing strong interest. This could be a key growth area for our business."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"

  - entity: "calls"
    count: 4
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call summary: Prospect from Downtown LA boutique cafe interested in our toaster solutions. This area is showing strong market potential."
          - "Regional market call: Customer from Downtown LA coffee shop called about toaster equipment. This represents new regional opportunity."
          - "Geographic expansion call: Prospect from Downtown LA area shows strong interest. This regional market segment could be worth targeting more aggressively."
          - "Market opportunity call: Downtown LA cafe prospect discussed toaster needs. This area is showing unexpected demand from boutique cafe segment."
      - name: "direction"
        type: "static"
        value: "Inbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "activity_at"
        type: "faker.past_date"

  - entity: "emails"
    count: 3
    properties:
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "subject"
        type: "static"
        value: "Toaster Inquiry - Downtown LA Cafe"
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Downtown LA cafe email: We're a boutique cafe in the Arts District and need toaster solutions. Your products look perfect for our needs."
          - "Regional inquiry email: Boutique cafe in Downtown LA area interested in your toaster equipment. This area seems to have strong demand for quality toaster solutions."
          - "LA market email: We're a specialty coffee shop in Downtown LA and need reliable toaster equipment. Your products seem ideal for boutique cafe environments."
      - name: "direction"
        type: "static"
        value: "Incoming"
      - name: "created_at"
        type: "faker.past_date"

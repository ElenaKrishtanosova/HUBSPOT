insight_name: "Cross-Industry Expectations"
description: "A data generation plan to validate the insight that across the hospitality and e-commerce industries, there's a growing expectation for toasters to have smart, app-based features, indicating a consistent shift in customer needs."

data_to_generate:
  - entity: "notes"
    count: 8
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Hospitality industry note: Hotel chain prospect asked about smart features and app connectivity. Said they expect modern appliances to have digital capabilities."
          - "E-commerce trend note: Multiple e-commerce customers asking about smart toaster features. Said they're used to app-controlled appliances from other industries."
          - "Cross-industry expectation note: Both hospitality and e-commerce prospects consistently ask about smart features. This represents a unified market expectation."
          - "Digital capability note: Customer from restaurant industry mentioned they expect toasters to have app-based controls. Said this is standard in modern hospitality."
          - "Smart feature demand note: E-commerce customer asked about WiFi connectivity and app features. Said they're comparing us to smart appliances from other industries."
          - "Industry convergence note: Hospitality and e-commerce customers showing similar expectations for smart features. This cross-industry trend is becoming consistent."
          - "Digital expectation note: Customer from hotel industry said they need app-based toaster controls. This smart feature expectation is growing across industries."
          - "Technology trend note: Both hospitality and e-commerce segments asking about smart features. This represents a unified shift toward digital appliance expectations."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"

  - entity: "calls"
    count: 6
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call transcript: Hotel chain prospect asked about smart features and app connectivity. Said they expect modern appliances to have digital capabilities."
          - "E-commerce call notes: Customer from online retail asked about smart toaster features. Said they're used to app-controlled appliances from other industries."
          - "Hospitality call: Restaurant prospect discussed need for app-based toaster controls. Said this is becoming standard expectation in their industry."
          - "Smart feature call: E-commerce customer called about WiFi connectivity. Said they expect toasters to have same smart features as other appliances."
          - "Digital expectation call: Hotel industry prospect mentioned app-based controls as requirement. Said this technology expectation is growing across hospitality."
          - "Cross-industry call: Both hospitality and e-commerce customers showing similar smart feature expectations. This trend is becoming consistent across industries."
      - name: "direction"
        type: "static"
        value: "Inbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "activity_at"
        type: "faker.past_date"

  - entity: "emails"
    count: 4
    properties:
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "subject"
        type: "static"
        value: "Smart Features and App Connectivity Inquiry"
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Hospitality email: We're a hotel chain looking for smart toasters with app controls. This is becoming standard expectation in our industry."
          - "E-commerce inquiry email: We need toasters with smart features and app connectivity. Our customers expect modern appliances to have digital capabilities."
          - "Smart feature email: Looking for toasters with WiFi and app controls. This technology expectation is growing across both hospitality and e-commerce industries."
          - "Digital capability email: We need app-based toaster controls for our business. This smart feature expectation is becoming consistent across industries."
      - name: "direction"
        type: "static"
        value: "Incoming"
      - name: "created_at"
        type: "faker.past_date"

  - entity: "deals"
    count: 4
    properties:
      - name: "deal_name"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Hotel Chain - Smart Toaster Requirements"
          - "E-commerce Platform - Digital Appliance Needs"
          - "Hospitality Group - Smart Feature Inquiry"
      - name: "deal_stage"
        type: "static"
        value: "Qualified to Buy"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Hotel chain prospect needs smart toasters with app controls. Said this is becoming standard expectation in hospitality industry."
          - "E-commerce customer asking about smart features and app connectivity. This digital expectation is growing across industries."
          - "Hospitality prospect mentioned app-based controls as requirement. This technology expectation is becoming consistent across sectors."
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "activity_date"
        type: "faker.past_date"

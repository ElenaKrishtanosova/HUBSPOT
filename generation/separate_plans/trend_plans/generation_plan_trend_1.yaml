insight_name: "Gluten-Free Keyword Spike"
description: "A data generation plan to validate the insight that the phrase 'gluten-free' is spiking unexpectedly in customer feedback and support calls, indicating a growing health-conscious segment of our market."

data_to_generate:
  - entity: "notes"
    count: 8
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer feedback note: Customer specifically asked if our toaster is safe for gluten-free bread. This is the 3rd inquiry this week about gluten-free compatibility."
          - "Support call note: Customer concerned about cross-contamination for gluten-free bread. Said they need assurance our toaster won't mix with regular bread."
          - "Sales feedback note: Prospect asked about gluten-free bread compatibility. This gluten-free inquiry trend is becoming more frequent in our conversations."
          - "Customer service note: Multiple customers asking about gluten-free bread safety. The 'gluten-free' keyword is appearing in almost every support interaction."
          - "Health-conscious segment note: Customer mentioned they chose our toaster because it's safe for gluten-free bread. This health-conscious segment is growing."
          - "Dietary requirement note: Customer called about gluten-free bread toasting. Said they have celiac disease and need gluten-free safe appliances."
          - "Market trend note: The frequency of 'gluten-free' mentions in customer feedback has increased 300% this quarter. This represents a clear market shift."
          - "Health trend note: Customer feedback consistently mentions gluten-free bread compatibility. This health-conscious trend is accelerating rapidly."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"

  - entity: "calls"
    count: 5
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call transcript: Customer called specifically about gluten-free bread compatibility. Said they need assurance our toaster won't cause cross-contamination."
          - "Support call notes: Customer with celiac disease asked about gluten-free bread safety. This gluten-free inquiry is becoming more common."
          - "Sales call summary: Prospect mentioned they only eat gluten-free bread and need a toaster that's safe for their dietary requirements."
          - "Health inquiry call: Customer called to ask about gluten-free bread toasting. Said they're part of a growing health-conscious community."
          - "Dietary need call: Customer discussed gluten-free bread requirements. The frequency of these calls has increased significantly this month."
      - name: "direction"
        type: "static"
        value: "Inbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "activity_at"
        type: "faker.past_date"

  - entity: "emails"
    count: 4
    properties:
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "subject"
        type: "static"
        value: "Gluten-Free Bread Compatibility Question"
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer email: I need to know if your toaster is safe for gluten-free bread. I have celiac disease and can't risk cross-contamination."
          - "Gluten-free inquiry email: Looking for a toaster that's safe for gluten-free bread. Your product looks promising but I need confirmation about gluten-free compatibility."
          - "Health-conscious email: I'm part of a growing gluten-free community and need a toaster that won't mix with regular bread. Can you confirm your toaster is gluten-free safe?"
          - "Dietary requirement email: I only eat gluten-free bread and need a toaster that won't cause cross-contamination. This is a critical requirement for my health."
      - name: "direction"
        type: "static"
        value: "Incoming"
      - name: "created_at"
        type: "faker.past_date"

  - entity: "tickets"
    count: 3
    properties:
      - name: "ticket_name"
        type: "static"
        value: "Gluten-Free Bread Compatibility Inquiry"
      - name: "priority"
        type: "static"
        value: "Medium"
      - name: "issue_of_interest"
        type: "static"
        value: "Thermostat"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer ticket: Need information about gluten-free bread compatibility. Concerned about cross-contamination for celiac disease."
          - "Support ticket: Customer asking about gluten-free bread safety. This gluten-free inquiry trend is becoming more frequent."
          - "Inquiry ticket: Prospect wants to know if our toaster is safe for gluten-free bread. This health-conscious segment is growing."
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "ticket_owner"
        type: "random_existing_id"
        table: "users"
        column: "email"
      - name: "activity_date"
        type: "faker.past_date"

insight_name: "Artisan Bread Niche"
description: "A data generation plan to validate the insight that during sales calls for the '2-slice toaster', several prospects mentioned they are also looking for a model with a single, longer slot for artisan bread."

data_to_generate:
  - entity: "calls"
    count: 6
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Sales call notes: Prospect interested in 2-slice toaster but specifically asked about longer slots for artisan bread. Said they bake sourdough and need longer slots."
          - "Call transcript: Customer called about 2-slice toaster but mentioned they'd prefer a model with longer slots for their homemade bread. This seems to be a common request."
          - "Support call summary: Prospect asked if we have a 2-slice toaster with longer slots for artisan bread. Said they'd pay premium for this feature."
          - "Sales feedback call: Customer interested in 2-slice toaster but needs longer slots for their artisanal bread. This is the 3rd request this week for longer slots."
          - "Customer inquiry call: Prospect called about 2-slice toaster but specifically mentioned they need longer slots for their homemade sourdough bread."
          - "Market research call: Customer suggested we develop a 2-slice toaster with longer slots for artisan bread. Said this would fill a gap in the market."
      - name: "direction"
        type: "static"
        value: "Inbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "activity_at"
        type: "faker.past_date"

  - entity: "notes"
    count: 5
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Sales note: Multiple prospects asking about 2-slice toaster with longer slots for artisan bread. This seems to be an untapped market segment."
          - "Product development note: Customer feedback consistently mentions need for longer slots in 2-slice toaster for artisan bread. This could be a new product line."
          - "Market opportunity note: Several prospects have mentioned they'd pay premium for 2-slice toaster with longer slots for their homemade bread."
          - "Customer insight note: Artisan bread bakers are a growing customer segment. They need longer slots than our current 2-slice model offers."
          - "Product strategy note: The 2-slice toaster market could be expanded with longer slot options for artisan bread enthusiasts."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"

  - entity: "emails"
    count: 3
    properties:
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "subject"
        type: "static"
        value: "Inquiry about 2-slice toaster with longer slots"
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer email: I'm interested in your 2-slice toaster but need longer slots for my artisan bread. Do you have a model with longer slots?"
          - "Product inquiry email: Looking for a 2-slice toaster that can handle longer artisan bread. Your current model seems too short for my sourdough."
          - "Feature request email: I love your 2-slice toaster design but need longer slots for my homemade bread. Any plans to offer this option?"
      - name: "direction"
        type: "static"
        value: "Incoming"
      - name: "created_at"
        type: "faker.past_date"

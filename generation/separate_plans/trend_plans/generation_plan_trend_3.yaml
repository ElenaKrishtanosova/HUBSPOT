insight_name: "Eco-Friendly Mentions"
description: "A data generation plan to validate the insight that the positive mention of 'eco-friendly packaging' is steadily increasing in online reviews and notes from new customers."

data_to_generate:
  - entity: "notes"
    count: 8
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer feedback note: Customer specifically mentioned they love our eco-friendly packaging. Said it was a deciding factor in their purchase."
          - "Environmental appreciation note: New customer praised our eco-friendly packaging approach. This environmental consciousness is becoming more important to buyers."
          - "Packaging feedback note: Multiple customers mentioning eco-friendly packaging as positive feature. This environmental trend is accelerating."
          - "Sustainability note: Customer chose our toaster because of eco-friendly packaging. Said they're trying to reduce their environmental impact."
          - "Green packaging note: Customer feedback consistently mentions eco-friendly packaging as a selling point. This sustainability trend is growing."
          - "Environmental trend note: The frequency of 'eco-friendly' mentions in customer feedback has increased 200% this year. This represents a clear market shift."
          - "Sustainability selling point note: Customer mentioned eco-friendly packaging was key to their decision. This environmental consciousness is expanding."
          - "Green consumer note: New customer segment is specifically looking for eco-friendly packaging. This sustainability trend is becoming mainstream."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"

  - entity: "emails"
    count: 5
    properties:
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "subject"
        type: "static"
        value: "Eco-Friendly Packaging Appreciation"
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer email: I love that your toaster comes in eco-friendly packaging. This environmental consciousness was a major factor in my purchase decision."
          - "Sustainability email: Thank you for using eco-friendly packaging. I'm trying to reduce my environmental impact and appreciate companies that share this value."
          - "Green packaging email: Your eco-friendly packaging approach is exactly what I look for in products. This sustainability focus is becoming more important to consumers."
          - "Environmental appreciation email: I chose your toaster partly because of the eco-friendly packaging. This shows your company cares about the environment."
          - "Sustainability feedback email: The eco-friendly packaging was a pleasant surprise. More companies should follow your example of environmental responsibility."
      - name: "direction"
        type: "static"
        value: "Incoming"
      - name: "created_at"
        type: "faker.past_date"

  - entity: "calls"
    count: 4
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call transcript: Customer called specifically to praise our eco-friendly packaging. Said it was a deciding factor in their purchase."
          - "Environmental feedback call: Customer mentioned they chose our toaster because of eco-friendly packaging. This sustainability trend is growing."
          - "Green packaging call: Customer called to compliment our eco-friendly approach. Said they're part of a growing environmentally conscious consumer base."
          - "Sustainability call: Customer discussed our eco-friendly packaging during support call. This environmental consciousness is becoming more common."
      - name: "direction"
        type: "static"
        value: "Inbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "activity_at"
        type: "faker.past_date"

  - entity: "deals"
    count: 3
    properties:
      - name: "deal_name"
        type: "static"
        value: "Eco-Friendly Packaging Driven Purchase"
      - name: "deal_stage"
        type: "static"
        value: "Closed Won"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer chose our toaster because of eco-friendly packaging. Said environmental consciousness was key to their decision."
          - "Prospect mentioned eco-friendly packaging as selling point. This sustainability focus is becoming more important to consumers."
          - "Client purchased toaster partly for eco-friendly packaging. This environmental trend is accelerating in the market."
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "activity_date"
        type: "faker.past_date"

insight_name: "Wi-Fi Setup Confusion"
description: "A data generation plan to validate the insight that 20% of support tickets for the smart toaster are related to Wi-Fi setup confusion. The plan focuses on creating multiple tickets and associated notes that highlight this specific problem."

data_to_generate:
  - entity: "tickets"
    count: 8
    properties:
      - name: "ticket_name"
        type: "static"
        value: "Trouble connecting smart toaster to WiFi"
      - name: "priority"
        type: "static"
        value: "Medium"
      - name: "issue_of_interest"
        type: "static"
        value: "Wi‑Fi setup"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "I'm having trouble connecting my new smart toaster to my home Wi-Fi network. The manual instructions are very confusing and don't seem to work."
          - "The smart toaster app keeps failing during the Wi-Fi setup process. I followed the steps exactly but it won't connect."
          - "Customer is calling in because the manual does not clearly explain the Wi-Fi setup procedure. Needs help with the app pairing process."
          - "The instructions for connecting the smart toaster to Wi-Fi are unclear. I've tried multiple times and it always fails. The app just shows a spinning wheel."
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "ticket_owner"
        type: "random_existing_id"
        table: "users"
        column: "email"
      - name: "activity_date"
        type: "faker.past_date"

  - entity: "notes"
    count: 5
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Support note: Customer on the call is very confused about the smart toaster manual. The Wi-Fi setup steps are not intuitive. Referred them to the online video guide."
          - "Internal note: A high number of tickets about 'Wi-Fi setup' this week. We should flag this as a potential issue with the product manual."
          - "Manager note: I spoke with the customer and they confirmed the manual's Wi-Fi section is poorly written. They were frustrated and almost returned the product."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "ticket_id"
        type: "random_existing_id"
        table: "tickets"
        column: "ticket_id"
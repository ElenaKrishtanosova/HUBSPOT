insight_name: "Misunderstood Feature"
description: "A data generation plan to validate the insight about customers misusing the 'bagel' setting on the '4-slice toaster' model. This plan focuses on creating a pattern of support tickets, calls, and internal tasks that highlight this specific problem."

data_to_generate:
  - entity: "tickets"
    count: 5
    properties:
      - name: "ticket_name"
        type: "static"
        value: "Bagel setting on 4-slice toaster not working"
      - name: "priority"
        type: "static"
        value: "Medium"
      - name: "issue_of_interest"
        type: "static"
        value: "Thermostat"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "I'm calling about my 4-slice toaster. The bagel setting isn't working—it only toasts one side of the bagel. I think the heating element is broken."
          - "A customer believes their new 4-slice toaster is defective. They report that the bagel setting only toasts the outside, leaving the inside untoasted."
          - "Customer is frustrated because the bagel setting on their 4-slice toaster isn't toasting evenly. They think the manual is unclear about how to use it."
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "ticket_owner"
        type: "random_existing_id"
        table: "users"
        column: "email"
      - name: "activity_date"
        type: "faker.past_date"

  - entity: "notes"
    count: 4
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Internal note: Received a call from a client confused about the bagel setting. They didn't realize it's designed to toast one side only."
          - "Support note: The customer on Ticket #<TICKET_ID> claims the bagel setting is broken. Explained that it's a single-sided function. The user seemed confused but understood."
          - "Manager note: Flagging a recurring issue. Customers are consistently misinterpreting the function of the bagel setting on the 4-slice toaster. The manual may need revision."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "ticket_id"
        type: "random_existing_id"
        table: "tickets"
        column: "ticket_id"

  - entity: "calls"
    count: 3
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call summary: Customer called about their 4-slice toaster. They were disappointed that the bagel setting only toasted one side. Spent 5 minutes explaining how the feature is intended to work."
          - "Support call: Customer confused about the bagel setting. They were under the impression it was a 'special' toasting mode, not a single-sided one. The manual is clearly not sufficient."
      - name: "direction"
        type: "static"
        value: "Inbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "activity_at"
        type: "faker.past_date"

  - entity: "tasks"
    count: 2
    properties:
      - name: "title"
        type: "static"
        value: "Review and update manual instructions for bagel setting"
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Internal task note: A recurring issue with the bagel setting on the 4-slice toaster is causing support calls. The product team needs to review the manual for clarity."
          - "Task note: This task is to update the product manual to clearly explain the single-sided toasting function of the bagel setting on the 4-slice toaster."
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"
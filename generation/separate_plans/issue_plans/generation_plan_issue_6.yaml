insight_name: "Internal Process Failures"
description: "A data generation plan to validate the insight that a customer was transferred between three different departments to resolve a single billing issue, indicating a lack of internal process coordination. This plan focuses on a ticket, a series of notes, and tasks that reflect a broken internal process."

data_to_generate:
  - entity: "contacts"
    count: 1
    properties:
      - name: "first_name"
        type: "faker.first_name"
      - name: "last_name"
        type: "faker.last_name"
      - name: "contact_email"
        type: "faker.email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"

  - entity: "tickets"
    count: 1
    properties:
      - name: "ticket_name"
        type: "static"
        value: "Billing issue with recent order"
      - name: "priority"
        type: "static"
        value: "High"
      - name: "issue_of_interest"
        type: "static"
        value: "Invoice"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Customer is confused about a recent invoice and believes they were overcharged. They are frustrated after being transferred to three different departments."
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "ticket_owner"
        type: "random_existing_id"
        table: "users"
        column: "email"
      - name: "activity_date"
        type: "faker.past_date"

  - entity: "notes"
    count: 3
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Support note: Customer called about a billing issue. I transferred them to the billing department."
          - "Billing note: Customer was transferred to us from support. The issue is with the order system, so I transferred them to the sales team."
          - "Sales team note: Customer was transferred from billing. The issue is a system error. I will work with the billing department to resolve this."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "ticket_id"
        type: "random_existing_id"
        table: "tickets"
        column: "ticket_id"

  - entity: "tasks"
    count: 3
    properties:
      - name: "title"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Task: Follow up with the Billing Department regarding invoice dispute for Ticket #<TICKET_ID>."
          - "Task: Coordinate with the Sales Team on a system error affecting a customer's invoice (Ticket #<TICKET_ID>)."
          - "Task: Send a follow-up email to the customer on Ticket #<TICKET_ID> after getting clarification from the internal teams."
      - name: "notes"
        type: "static"
        value: "This task was created to track the customer's billing issue after they were transferred to a different department."
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"
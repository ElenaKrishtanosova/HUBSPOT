insight_name: "High-Volume Demand"
description: "A data generation plan to validate the insight that a note from a B2B deal with a small restaurant chain indicates they need a toaster that can handle high volume without overheating, a core strength of our commercial-grade models."

data_to_generate:
  - entity: "deals"
    count: 4
    properties:
      - name: "deal_name"
        type: "static"
        value: "Restaurant Chain - High-Volume Toaster Requirements"
      - name: "deal_stage"
        type: "static"
        value: "Presentation Scheduled"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "B2B prospect needs toaster that can handle high volume without overheating. Our commercial-grade models are perfect for this requirement."
          - "Restaurant chain looking for toaster solution for high-volume breakfast service. They need reliability and consistent performance under heavy use."
          - "Prospect from restaurant industry needs toaster that won't overheat during peak hours. Our commercial models excel in high-volume scenarios."
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "activity_date"
        type: "faker.past_date"

  - entity: "notes"
    count: 6
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "B2B meeting note: Restaurant chain needs toaster that can handle 200+ slices per hour without overheating. Our commercial models are perfect for this."
          - "Technical requirement note: Prospect needs toaster with thermal management for high-volume use. Our commercial-grade models excel in this area."
          - "Business requirement note: Restaurant chain's main concern is overheating during peak breakfast hours. Our commercial toasters are designed for this exact scenario."
          - "Volume requirement note: Prospect needs toaster that can handle continuous high-volume operation. This is a core strength of our commercial product line."
          - "Performance requirement note: Restaurant needs toaster that maintains consistent performance under heavy use. Our commercial models are built for this."
          - "B2B opportunity note: High-volume toaster requirement from restaurant chain represents significant opportunity for our commercial product line."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"

  - entity: "calls"
    count: 3
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call summary: Restaurant chain prospect discussed their need for high-volume toaster that won't overheat. Our commercial models are ideal for this requirement."
          - "B2B call notes: Prospect from restaurant industry needs toaster solution for high-volume breakfast service. They're impressed with our commercial-grade thermal management."
          - "Technical discussion call: Customer called to discuss high-volume toaster requirements. Our commercial models' ability to handle continuous use without overheating was key selling point."
      - name: "direction"
        type: "static"
        value: "Outbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "activity_at"
        type: "faker.past_date"

  - entity: "emails"
    count: 2
    properties:
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "subject"
        type: "static"
        value: "High-Volume Toaster Requirements"
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Restaurant email: We need a toaster that can handle high volume without overheating. Your commercial models seem perfect for our requirements."
          - "B2B inquiry email: Looking for toaster solution for restaurant chain. Need high-volume capability with reliable thermal management. Your commercial line looks promising."
      - name: "direction"
        type: "static"
        value: "Incoming"
      - name: "created_at"
        type: "faker.past_date"

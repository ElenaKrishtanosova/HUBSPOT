# HubSpot CRM Insights Master Configuration
# Управление всеми инсайтами в одном файле

insights:
  # Инсайт 1: Проблемы с Smart Toaster App
  - name: "Smart Toaster App Issues"
    description: "A pattern of support notes indicates that customers are finding the 'smart toaster' app to be 'buggy' and 'freezes frequently'"
    entities:
      - entity: "tickets"
        count: 15
        properties:
          - name: "ticket_name"
            type: "static"
            value: "Smart Toaster App Freezing Issue"
          - name: "pipeline"
            type: "static"
            value: "Support Pipeline"
          - name: "ticket_status"
            type: "static"
            value: "Open"
          - name: "priority"
            type: "static"
            value: "High"
          - name: "source"
            type: "static"
            value: "Web form"
          - name: "ticket_owner"
            type: "random_existing_id"
            table: "users"
            column: "email"
          - name: "description"
            type: "llm_generated_text"
            llm_prompt_context:
              - "Customer reports that the smart toaster app freezes when trying to set custom toast settings"
              - "App crashes every time user tries to connect to WiFi network"
              - "Smart toaster app becomes unresponsive after 5 minutes of use"
              - "Customer cannot complete firmware update due to app freezing"
              - "Smart toaster app shows error message and then freezes completely"
          - name: "activity_date"
            type: "faker.past_date"
          - name: "contact_email"
            type: "random_existing_id"
            table: "contacts"
            column: "contact_email"
          - name: "company_domain"
            type: "random_existing_id"
            table: "companies"
            column: "company_domain"
          - name: "issue_of_interest"
            type: "static"
            value: "Wi‑Fi setup"
          - name: "issued_before"
            type: "static"
            value: "No"
      
      - entity: "notes"
        count: 8
        properties:
          - name: "body"
            type: "llm_generated_text"
            llm_prompt_context:
              - "Support note: Customer called about smart toaster app freezing. App becomes unresponsive when trying to set custom toast settings. This is the 3rd call this week about app issues."
              - "Technical note: Smart toaster app crashes during WiFi setup. Error logs show memory leak in the app. Need to escalate to development team."
              - "Customer feedback: Smart toaster app is buggy and freezes frequently. User had to restart the app 5 times to complete a simple task."
              - "Support escalation: Multiple customers reporting smart toaster app freezing issues. Pattern suggests systematic problem with mobile application."
              - "Quality assurance note: Smart toaster app tested on multiple devices, consistently freezes after 10-15 minutes of use. Critical bug identified."
          - name: "activity_date"
            type: "faker.past_date"
          - name: "activity_assigned_to_user_id"
            type: "random_existing_id"
            table: "users"
            column: "user_id"
          - name: "contact_email"
            type: "random_existing_id"
            table: "contacts"
            column: "contact_email"
          - name: "company_domain"
            type: "random_existing_id"
            table: "companies"
            column: "company_domain"
      
      - entity: "emails"
        count: 5
        properties:
          - name: "contact_email"
            type: "random_existing_id"
            table: "contacts"
            column: "contact_email"
          - name: "subject"
            type: "static"
            value: "Smart Toaster App Issues - Urgent Support Needed"
          - name: "send_status"
            type: "static"
            value: "Sent"
          - name: "body"
            type: "llm_generated_text"
            llm_prompt_context:
              - "Customer email: The smart toaster app keeps freezing when I try to use it. I've tried restarting my phone and reinstalling the app, but the problem persists. This is very frustrating as I can't use the smart features I paid for."
              - "Support response: We apologize for the smart toaster app issues you're experiencing. Our technical team is aware of the freezing problems and working on a fix. In the meantime, you can use the manual controls on the toaster."
              - "Customer complaint: The smart toaster app is completely unusable due to constant freezing. I've spent hours trying to get it to work properly. This is not what I expected when I bought a premium smart appliance."
          - name: "direction"
            type: "static"
            value: "Incoming"
      
      - entity: "calls"
        count: 3
        properties:
          - name: "notes"
            type: "llm_generated_text"
            llm_prompt_context:
              - "Call summary: Customer called about smart toaster app freezing. App becomes unresponsive after 2-3 minutes of use. Customer is very frustrated and wants immediate solution."
              - "Support call: Smart toaster app crashes during WiFi setup process. Customer tried multiple times but app freezes every time. Escalated to technical support."
              - "Customer service call: Multiple complaints about smart toaster app being buggy and freezing frequently. Pattern of issues suggests systematic problem with mobile application."
          - name: "direction"
            type: "static"
            value: "Inbound"
          - name: "status"
            type: "static"
            value: "Completed"
          - name: "title"
            type: "static"
            value: "Smart Toaster App Support Call"
          - name: "activity_at"
            type: "faker.past_date"
          - name: "assigned_to_user_id"
            type: "random_existing_id"
            table: "users"
            column: "user_id"
          - name: "duration_ms"
            type: "static"
            value: "300000"
          - name: "outcome"
            type: "static"
            value: "Connected"
          - name: "source"
            type: "static"
            value: "Phone"
          - name: "from_number"
            type: "static"
            value: "+15551234567"
          - name: "to_number"
            type: "static"
            value: "+15559876543"
          - name: "recording_url"
            type: "static"
            value: "https://example.com/recordings/call_123.mp3"
          - name: "transcript_available"
            type: "static"
            value: "true"
          - name: "call_meeting_type"
            type: "static"
            value: "Support Call"

  # Инсайт 2: Проблемы с 4-slice Toaster (заготовка для будущего)
  - name: "4-slice Toaster Problems"
    description: "Increased support complaints for the '4-slice toaster' indicating mechanical issues"
    entities:
      - entity: "tickets"
        count: 10
        properties:
          - name: "ticket_name"
            type: "static"
            value: "4-slice Toaster Mechanical Issue"
          - name: "pipeline"
            type: "static"
            value: "Support Pipeline"
          - name: "ticket_status"
            type: "static"
            value: "Open"
          - name: "priority"
            type: "static"
            value: "Medium"
          - name: "source"
            type: "static"
            value: "Phone"
          - name: "ticket_owner"
            type: "random_existing_id"
            table: "users"
            column: "email"
          - name: "description"
            type: "llm_generated_text"
            llm_prompt_context:
              - "Customer reports that the lever on the 4-slice toaster won't stay down"
              - "4-slice toaster emits black smoke and burning smell when turned on"
              - "Right side of 4-slice toaster always pale while left side is almost black"
          - name: "activity_date"
            type: "faker.past_date"
          - name: "contact_email"
            type: "random_existing_id"
            table: "contacts"
            column: "contact_email"
          - name: "company_domain"
            type: "random_existing_id"
            table: "companies"
            column: "company_domain"
          - name: "issue_of_interest"
            type: "static"
            value: "Thermostat"
          - name: "issued_before"
            type: "static"
            value: "No"
      
      - entity: "notes"
        count: 5
        properties:
          - name: "body"
            type: "llm_generated_text"
            llm_prompt_context:
              - "Manager's note: Client called to complain about the 4-slice toaster's uneven toasting"
              - "Note: A client left a negative review mentioning that the 4-slice toaster stopped working after only a month"
          - name: "activity_date"
            type: "faker.past_date"
          - name: "activity_assigned_to_user_id"
            type: "random_existing_id"
            table: "users"
            column: "user_id"
          - name: "contact_email"
            type: "random_existing_id"
            table: "contacts"
            column: "contact_email"
          - name: "company_domain"
            type: "random_existing_id"
            table: "companies"
            column: "company_domain"

# Глобальные настройки для всех инсайтов
global_settings:
  start_date: "2023-01-01"
  end_date: "2024-12-31"
  llm_model: "gpt-3.5-turbo"
  max_tokens: 150
  temperature: 0.8 
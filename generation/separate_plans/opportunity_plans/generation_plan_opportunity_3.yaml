insight_name: "Partnership Suggestion"
description: "A data generation plan to validate the insight that a key client expressed strong interest in a joint promotional campaign with a gourmet toast spread company, suggesting a potential partnership opportunity."

data_to_generate:
  - entity: "deals"
    count: 3
    properties:
      - name: "deal_name"
        type: "static"
        value: "Partnership Opportunity - Gourmet Spread Campaign"
      - name: "deal_stage"
        type: "static"
        value: "Qualified to Buy"
      - name: "description"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Key client expressed strong interest in joint promotional campaign with gourmet toast spread company. This could open new market opportunities."
          - "Prospect mentioned they work with several gourmet food companies and see potential for collaborative marketing campaigns with our toaster products."
          - "Client suggested partnership opportunity with gourmet spread company for joint promotional campaign. This could expand our market reach significantly."
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "company_domain"
        type: "random_existing_id"
        table: "companies"
        column: "company_domain"
      - name: "activity_date"
        type: "faker.past_date"

  - entity: "notes"
    count: 6
    properties:
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Sales meeting note: Key client brought up partnership opportunity with gourmet spread company. They see strong potential for joint promotional campaigns."
          - "Strategic opportunity note: Client mentioned they have connections with gourmet food industry and want to explore collaborative marketing with our toaster products."
          - "Partnership discussion note: During sales call, prospect suggested we partner with gourmet spread company for joint promotional campaign. This could be a game-changer."
          - "Market expansion note: Client's partnership suggestion with gourmet spread company could open doors to new customer segments we haven't targeted before."
          - "Collaborative marketing note: Prospect expressed interest in joint promotional campaign with gourmet spread company. This partnership could increase our market visibility."
          - "Strategic alliance note: Client's partnership suggestion with gourmet food company represents a significant opportunity to expand our market presence."
      - name: "activity_date"
        type: "faker.past_date"
      - name: "activity_assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "deal_id"
        type: "random_existing_id"
        table: "deals"
        column: "deal_id"

  - entity: "calls"
    count: 4
    properties:
      - name: "notes"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Call summary: Client discussed partnership opportunity with gourmet spread company. They see potential for joint promotional campaigns that could benefit both companies."
          - "Sales call notes: Prospect mentioned they have strong relationships with gourmet food industry and want to explore collaborative marketing opportunities with our toasters."
          - "Partnership discussion call: Client called specifically to discuss potential partnership with gourmet spread company for joint promotional campaign."
          - "Strategic opportunity call: During follow-up call, prospect elaborated on partnership idea with gourmet food company. This could be a significant market expansion opportunity."
      - name: "direction"
        type: "static"
        value: "Outbound"
      - name: "assigned_to_user_id"
        type: "random_existing_id"
        table: "users"
        column: "user_id"
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "activity_at"
        type: "faker.past_date"

  - entity: "emails"
    count: 3
    properties:
      - name: "contact_email"
        type: "random_existing_id"
        table: "contacts"
        column: "contact_email"
      - name: "subject"
        type: "static"
        value: "Partnership Opportunity Discussion"
      - name: "body"
        type: "llm_generated_text"
        llm_prompt_context:
          - "Client email: I wanted to follow up on our discussion about partnering with a gourmet spread company for joint promotional campaigns. This could be mutually beneficial."
          - "Partnership proposal email: Following our call, I'd like to explore the partnership opportunity with gourmet food companies. This could open new markets for both of us."
          - "Collaborative marketing email: I'm excited about the potential partnership with gourmet spread company. This joint promotional campaign could significantly expand our market reach."
      - name: "direction"
        type: "static"
        value: "Incoming"
      - name: "created_at"
        type: "faker.past_date"
